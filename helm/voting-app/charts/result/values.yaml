replicaCount: 2

image:
  repository: shakeelkhuhro1/result
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

config:
  dbHost: postgresql
  dbPort: "5432"
  dbName: postgres

secret:
  username: postgres
  password: postgres

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  path: /
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
