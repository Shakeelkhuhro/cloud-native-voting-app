{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Release.Name }}-ingress

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:

  - host: {{ .Values.ingress.voteHost }}

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: {{ .Release.Name }}-vote

            port:

              number: 80

  - host: {{ .Values.ingress.resultHost }}

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: {{ .Release.Name }}-result

            port:

              number: 80

{{- end }}
